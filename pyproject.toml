[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdpilot"
version = "1.0.0"
description = "AMBER molecular dynamics simulation agent runtime"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "MDPilot team" }]
dependencies = [
    "litellm>=1.40",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyfiglet>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "textual>=0.47.0",
    "pyratatui>=0.2.7",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "asyncssh>=2.14.0",
    "tenacity>=8.2.0",
    "tiktoken>=0.5.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "memory-profiler>=0.61",
    "psutil>=5.9",
    "matplotlib>=3.7",
    "httpx>=0.27.0",
]

[project.scripts]
mdpilot = "mdpilot.cli.mdpilot_cli:main"
md = "mdpilot.cli.shortcuts:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mdpilot"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
python_files = ["test_*.py", "bench_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow tests (deselect with '-m \"not slow\"')",
    "benchmark: marks tests as benchmark tests",
    "e2e: marks tests as end-to-end tests requiring real remote services (deselect with '-m \"not e2e\"')",
]
